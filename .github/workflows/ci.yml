name: CI Quality Gate

on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-policy:
    name: Shift-Left Branch Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate Branch Naming Standard
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "Evaluating branch name: ${BRANCH_NAME}"
          bash .makelib/scripts/check-branch.sh "${BRANCH_NAME}"

  quality:
    name: 8-Stage Quality Gate Pipeline
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python for detect-secrets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets

      - name: Install project and makelib dependencies
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          make makelib-install

      - name: Verify Code Formatting
        run: make format-check

      - name: Run all 8 quality gates
        run: make check-all
